aboutText: >-
    To CAD, or not to CAD? I’m Reda Elmountassir, a <i>mechanical engineer and full-stack developer</i> based in Philadelphia.
    I enjoy working where creative design and technology meet---from modeling parts for full-scale robots in SolidWorks
    to building interactive software experiences just like this site.<br /><br />

    My engineering projects involve CAD modeling, assembly drawings, finite element analysis, laser-cut components, and 3D-printed
    prototypes. My experience includes <em>4+</em> years of R&D at <i>The Franklin Institute</i>, where I worked on robotics exhibits seen
    by <em>hundreds</em>, and software development work with <i>Coded By: Ventures</i> including educating interns into
    becoming the next-generation of innovators (formerly Draft Studios). All throughout these disciplines, I still enjoyed quickly
    learning new tools, solving practical problems, and making ideas real. Above that, the opportunity to impact my community
    and create further opportunities for otherwise marginalized individuals has been fulfilling.<br /><br />

    Outside of engineering, I’m into soccer, traveling, rap music, consuming the arts, and creating (sketching, painting, video games, etc.).
    I’m loudly proud of my <em title="deema Maghreb!">Moroccan culture</em>, but don't forget: <em>Go Birds!</em>
