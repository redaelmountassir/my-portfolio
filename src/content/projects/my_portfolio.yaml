description: >-
    Designed and developed my personal portfolio around the visual language of
    early Macintosh and Windows desktop operating systems. The project evolved
    from a Flask-based website (can be found on my GitHub!) to Gatsby and React,
    then to a Vite-based build managed with pnpm. Each migration was an
    opportunity to learn a different stack and make the site more extensible;
    the move to Vite and pnpm also noticeably improved development and build
    iteration speed. The greatest technical challenge was carrying the
    interface through several major refactors without losing its character.
    The result is both a personal showcase and an ongoing experiment in
    frontend architecture and interaction design.
