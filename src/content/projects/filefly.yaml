description: >-
    FileFly is an in-progress desktop application for automating repetitive
    file-management tasks. Inspired by my experience at Zero Vector Ventures
    and my own storage-management frustrations, I explored the problem through
    desk research and surveys of dozens of people. I built a working interface
    for composing automation rules as node graphs, including the ability to
    save and reload those graphs. The planned automation engine will use Rust
    to execute configurable workflows such as event-triggered batch renaming,
    moving files into folders, and scheduled deletion. The interface and graph
    persistence work today; actual file automation is still under development.
