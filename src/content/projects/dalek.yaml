description: >-
    Collaborated with a team at The Franklin Institute to build a life-size,
    remotely controlled Dalek replica. I developed its ESP32-based wireless
    controller, contributed substantially to the Python control software, and
    was responsible for implementing communication-loss failsafes (having had
    2 somewhat funny incidents without them...). The robot used two
    independently driven wheels and a passive caster, with motors, swappable
    rechargeable battery packs, and body control electronics mounted on a flat
    base beneath a stacked frame and outer shell. A rotating head rested on a
    circular turntable and used separate onboard electronics and a second
    control server. The ESP32 remote converted analog inputs into JSON
    commands sent over Wi-Fi using UDP; the body Raspberry Pi handled drive
    control and forwarded commands to the head. The completed system
    successfully demonstrated wireless driving, independent head rotation,
    and automatic drive-stop behavior when communication timed out.
