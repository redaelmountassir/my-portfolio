description: >-
    Created for the Coded By: Kids Ctrl+Shift Competitionn, a Philadelphia-based
    web development competition challenging high school students to build
    creative, technically ambitious websites with a social development focus,
    this site was awarded first place. With a deadline of about a months time,
    heavy pre-planning via Figma and asset creation took a decent portion of the
    development time. While programming-wise the site is relatively simple,
    being a static frontend, the complexity comes from the 3D used throughout
    such as raymarching, and shader algorithm that is an alternative to
    rasterized rendering. By combining graphics programming, interactive
    design, and educational content, the project demonstrates how web
    technologies can make art more engaging and accessible.
