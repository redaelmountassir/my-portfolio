description: >-
    For the MEAM 1010 class project, our team designed and fabricated a siege
    machine to launch 1″ bouncy balls over a 6″ wall and toward a target 6 ft
    away. The machine was developed under strict design constraints: it had to
    fit within a 12″ x 12″ x 12″ volume at the start of competition, remain on
    the floor during operation, include at least one moving part and one
    3D-printed part, and be manufactured primarily in MEAM labs using laser
    cutting and 3D printing without adhesives or tape, instead using
    alternative joining methods like press fits.

    I worked in a team of three and designed most of the mechanical components
    in SolidWorks. The structure was primarily fabricated from laser-cut
    acrylic, while a custom 3D-printed projectile carriage was used to achieve
    geometry better suited to additive manufacturing. This project highlights
    mechanical design under constraints, design-for-manufacture thinking, and
    prototype development using both subtractive and additive fabrication
    methods.
