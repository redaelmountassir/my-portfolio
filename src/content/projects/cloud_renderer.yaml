description: >-
    Built a custom volumetric cloud renderer in Unity for use in my
    game-development projects, with performance-sensitive applications such as
    VR in mind. Drawing on published cloud-rendering techniques, including
    those described for Horizon Zero Dawn, I implemented the shader algorithms
    from their mathematical principles using HLSL. A separate compute-shader
    pipeline generates configurable 3D noise textures, including Perlin and
    Worley noise, that can be supplied to the cloud raymarcher instead of being
    coupled to its rendering logic. I also built a C# interface for adjusting
    generation parameters.
