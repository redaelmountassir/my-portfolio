description: >-
    Two SolidWorks studies exploring mechanical assembly reconstruction and
    structural analysis. For the first, I recreated a disassembled wind-up toy
    of a crab, working out how its components fit and move together before
    building an assembly with accurate gear mates, an animated multi-angle
    view, and an exploded view. The main challenge was reconstructing the
    mechanism without an intact reference assembly. In a separate MEAM 2470
    study, I designed and analyzed an acrylic tension strap intended to carry
    a tensile load around an obstacle. I used stress and displacement
    simulations to examine the proposed strap against laboratory design
    targets: a 200 N nominal load, a 0.15 in elongation limit, a predicted
    failure-load range of 400-900 N, and minimum part weight.
